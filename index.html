<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transmisión en Vivo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe id="reproductor" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="Transmisión en vivo"></iframe>
<script>
  // ====== CONFIGURACIÓN ======
  const ID_POR_DEFECTO = "yZy4WUH"; // ID de la transmisión que quieres ver
  const PASSWORD = "";                      // opcional
  // ===========================
  const id = (new URLSearchParams(location.search).get("id") || ID_POR_DEFECTO).trim();
  let url = `https://vdo.ninja/?view=${encodeURIComponent(id)}&cleanoutput&autostart`;
  if (PASSWORD) url += `&password=${encodeURIComponent(PASSWORD)}`;
  document.getElementById("reproductor").src = url;
</script>
</body>
</html>
